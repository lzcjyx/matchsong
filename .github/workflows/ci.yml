# M1.3 CI：PR 门禁 + 模拟器/Release/依赖扫描扩展
# 必选五项（PLAN M1.3）：assembleDebug / testDebugUnitTest / lintDebug / detekt / ktlintCheck
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 必选门禁（Linux runner）----
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Coverage Gate (core ≥80%)
        run: ./gradlew jacocoCoverageVerification --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

  # ---- 模拟器 job：仪器/Compose UI 测试（M1.3-2；M2 起启用 UI 套件）----
  instrumented:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  # ---- 依赖漏洞扫描（M1.3-2；NVD 数据源无 API key 时降级为报告）----
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true # NVD 数据源不可用时降级（PLAN M1.2-3：扫描失败不阻塞主构建，记录原因）

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          if-no-files-found: ignore
